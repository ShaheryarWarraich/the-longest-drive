<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Longest Drive</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --ink: #3b372e; --ink-soft: #6b655a;
    --paper: #f7f2e4; --paper2: #fffdf3;
    --sky: #7fb7c9; --coral: #e8896b; --mustard: #e5b13f; --sage: #8faa6e; --plum: #9a7bb0;
    --hand: "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--hand); color: var(--ink);
    background:
      radial-gradient(circle at 18% 12%, rgba(0,0,0,.035) 0 1px, transparent 1.5px),
      radial-gradient(circle at 72% 64%, rgba(0,0,0,.03) 0 1px, transparent 1.5px),
      radial-gradient(ellipse at 50% 40%, #faf6ea 0%, var(--paper) 70%, #efe7d2 100%);
    background-size: 90px 90px, 130px 130px, 100% 100%;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #app { position: fixed; inset: 0; overflow: hidden; }
  .spiral {
    position: fixed; top: 0; left: 0; right: 0; height: 16px; z-index: 45; pointer-events: none;
    background: repeating-radial-gradient(circle at 10px 4px, transparent 0 4.5px, rgba(59,55,46,.55) 5px 6.5px, transparent 7px 30px);
    background-size: 34px 16px; opacity: .5;
  }
  .scene {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: max(12px, 2.2vmin); padding-top: max(20px, 3vmin);
    overflow-y: auto; overflow-x: hidden; touch-action: pan-y;
    opacity: 1; transition: opacity .6s ease, transform .8s cubic-bezier(.5,0,.8,.4);
  }
  .scene.enter { opacity: 0; transform: scale(.25); }
  .scene.leave { opacity: 0; transform: scale(6); pointer-events: none; }
  .scene.leave-flat { opacity: 0; pointer-events: none; }

  /* pencil line art */
  .sk { stroke: var(--ink); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .sk.thin { stroke-width: 1.6; }
  .sk.soft { stroke: var(--ink-soft); }
  .rough { filter: url(#roughF); }
  .wash { opacity: .42; filter: url(#blurF); stroke: none; }
  .wc-sky { fill: var(--sky); } .wc-coral { fill: var(--coral); } .wc-mustard { fill: var(--mustard); }
  .wc-sage { fill: var(--sage); } .wc-plum { fill: var(--plum); }
  svg text { font-family: var(--hand); fill: var(--ink); }
  svg text.halo, svg text.mtag { paint-order: stroke; stroke: var(--paper2); stroke-width: 4px; stroke-linejoin: round; font-weight: 700; }
  svg text.soft { fill: var(--ink-soft); }

  /* speech box */
  .say {
    position: relative; z-index: 5; margin: 2px auto 0; max-width: min(860px, 96%);
    background: var(--paper2); border: 2.5px solid var(--ink);
    border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
    padding: clamp(8px, 1.8vmin, 16px) clamp(16px, 3vmin, 28px);
    font-size: clamp(17px, 3.5vmin, 28px); line-height: 1.3;
    transform: rotate(-.4deg); box-shadow: 3px 4px 0 rgba(59,55,46,.15); animation: pop .4s ease;
  }
  .who { font-weight: 700; }
  .who.muntaha { color: #7a5f96; } .who.anya { color: #c56a4a; }
  @keyframes pop { from { transform: scale(.88); opacity: 0; } }

  .midart { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1vmin; text-align: center; min-height: 0; position: relative; z-index: 2; }

  /* map (serpentine road / floor plans / lounge) */
  .mapbox { position: relative; width: 100%; max-width: 1000px; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .mapbox svg.map { width: 100%; height: 100%; display: block; overflow: visible; }
  .roadline { stroke: var(--ink); stroke-width: 3; fill: none; }
  .roadfill { stroke: #e9e2cf; stroke-width: 22; fill: none; stroke-linecap: round; }
  .roaddash { stroke: var(--ink-soft); stroke-width: 1.6; fill: none; stroke-dasharray: 12 14; }
  .lmk text { font-size: 15px; }
  .lmk.dim { opacity: .55; }
  .tag { cursor: pointer; }
  .tag rect { fill: var(--paper2); stroke: var(--ink); stroke-width: 2; }
  .tag.starred rect { fill: #fbe8b0; }
  .tag text { font-size: 13px; }
  .tag text.t1 { font-weight: 700; font-size: 14px; }
  .tag text.t2 { fill: var(--ink-soft); font-size: 12px; }
  .tag.lit rect { stroke-width: 3; fill: #fff3c8; }
  .scenery { opacity: .16; pointer-events: none; }
  .cell rect { fill: var(--paper2); stroke: var(--ink); stroke-width: 2; cursor: pointer; }
  .cell.sel rect { fill: #fbe8b0; }
  .cell.truth rect { fill: #fde3d6; stroke-width: 3.5; }
  .cell.hol rect { fill: #f3f6e8; }
  .cell text.lab { font-size: 15px; font-weight: 700; }
  .cell text.hol { font-size: 11px; fill: #6b7a4a; }
  .cell text.ev { font-size: 12.5px; font-weight: 700; }
  .cell .evg { cursor: pointer; }
  .ftlayer { transition: opacity .9s ease; }

  /* dashboard */
  .dash {
    display: flex; align-items: center; justify-content: center; gap: clamp(8px, 2vmin, 22px);
    flex-wrap: wrap; flex: none; padding: 4px 0; z-index: 4;
  }
  .dash .cell {
    display: flex; align-items: center; gap: 8px;
    border: 2.5px solid var(--ink); background: var(--paper2);
    border-radius: 200px 14px 180px 14px / 14px 180px 14px 200px;
    padding: 3px 14px; font-weight: 700; font-size: clamp(14px, 3vmin, 22px); white-space: nowrap;
  }
  .dash .cell.time { background: rgba(229,177,63,.4); }
  .dash .cell svg { width: clamp(30px, 6vmin, 44px); height: clamp(24px, 4.8vmin, 36px); }

  /* buttons */
  .btnrow { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; z-index: 7; position: relative; }
  .btn {
    font-family: var(--hand); border: 2.5px solid var(--ink); cursor: pointer;
    background: var(--mustard); color: var(--ink); font-weight: 700;
    font-size: clamp(16px, 3.4vmin, 25px); padding: clamp(7px, 1.8vmin, 13px) clamp(18px, 4vmin, 32px);
    border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
    box-shadow: 3px 4px 0 rgba(59,55,46,.25); transform: rotate(.4deg); transition: transform .1s;
  }
  .btn:active { transform: rotate(.4deg) translate(2px, 3px); box-shadow: 1px 1px 0 rgba(59,55,46,.25); }
  .btn.alt { background: var(--sky); }
  .btn.float { position: absolute; left: 50%; transform: translateX(-50%) rotate(-.6deg); bottom: clamp(74px, 17vmin, 120px); z-index: 8; }
  .btn.float:active { transform: translateX(-50%) rotate(-.6deg) translate(2px,3px); }

  /* cards */
  .card { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 3vmin; background: rgba(59,55,46,.28); animation: fadein .35s ease; }
  .card .inner {
    position: relative; background: var(--paper2); border: 2.5px solid var(--ink);
    border-radius: 20px 8px 22px 8px / 8px 22px 8px 20px;
    max-width: min(680px, 94%); max-height: 92%; overflow-y: auto;
    padding: clamp(16px, 3.6vmin, 30px) clamp(18px, 4.5vmin, 40px);
    text-align: center; font-size: clamp(17px, 3.8vmin, 28px); line-height: 1.35;
    box-shadow: 6px 8px 0 rgba(59,55,46,.18); transform: rotate(.6deg); animation: pop .4s ease;
  }
  .card .inner::before, .card .inner::after { content: ""; position: absolute; width: 84px; height: 26px; background: rgba(229,177,63,.5); border-left: 1px dashed rgba(59,55,46,.3); border-right: 1px dashed rgba(59,55,46,.3); }
  .card .inner::before { top: -13px; left: 8%; transform: rotate(-5deg); }
  .card .inner::after  { top: -13px; right: 8%; transform: rotate(4deg); }
  .card .art { width: clamp(100px, 22vmin, 170px); margin: 0 auto .5vmin; display: block; }
  .card .art svg { width: 100%; display: block; overflow: visible; }
  .card .btn { margin-top: clamp(8px, 2vmin, 16px); }
  .card .sub { font-size: .68em; color: var(--ink-soft); display: block; margin-top: 4px; }
  .card .how { margin-top: 8px; font-size: .66em; line-height: 1.45; max-width: 46ch; margin-left: auto; margin-right: auto; }
  .card .how .hl { font-weight: 700; background: rgba(127,183,201,.35); border-radius: 10px; padding: 0 9px; margin-right: 4px; display: inline-block; }
  .card .quiet { margin-top: 10px; font-size: .7em; font-style: italic; color: var(--ink-soft); }
  .prow { display: flex; align-items: center; justify-content: center; gap: clamp(6px, 1.6vmin, 14px); margin-top: 8px; }
  .prow .pi svg { width: clamp(48px, 10vmin, 80px); display: block; overflow: visible; }
  .prow .arr svg { width: clamp(22px, 4.6vmin, 36px); display: block; overflow: visible; }
  @keyframes fadein { from { opacity: 0; } }

  .offby {
    position: absolute; left: 50%; transform: translateX(-50%) rotate(-1deg); bottom: clamp(80px, 19vmin, 130px); z-index: 15;
    background: var(--coral); color: #fff; font-weight: 700; border: 2.5px solid var(--ink);
    font-size: clamp(16px, 3.4vmin, 25px); padding: 8px 22px;
    border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px; box-shadow: 3px 4px 0 rgba(59,55,46,.25);
    animation: pop .3s ease; white-space: nowrap;
  }
  .offby.good { background: var(--sage); }
  .offby.note { background: var(--sky); color: var(--ink); }

  .toast {
    position: fixed; top: max(56px, 8vmin); right: max(10px, 1.8vmin); z-index: 55;
    background: var(--paper2); border: 2.5px solid var(--ink);
    border-radius: 200px 14px 180px 14px / 14px 180px 14px 200px;
    padding: 6px 16px; font-size: clamp(13px, 2.6vmin, 17px); max-width: min(360px, 70vw);
    box-shadow: 3px 4px 0 rgba(59,55,46,.2); animation: pop .3s ease;
  }
  .toast b { display: block; font-size: 1.05em; }

  /* chrome */
  .chrome { position: fixed; bottom: max(8px, 1.4vmin); right: max(8px, 1.4vmin); z-index: 50; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .chip { border: 2px solid var(--ink); cursor: pointer; font-family: var(--hand); background: var(--paper2); color: var(--ink); border-radius: 160px 10px 150px 10px / 10px 150px 10px 160px; padding: 3px 11px; font-size: clamp(12px, 2.3vmin, 15px); box-shadow: 2px 2px 0 rgba(59,55,46,.2); }
  .chip:active { transform: translate(1px,2px); box-shadow: none; }

  .modal { position: fixed; inset: 0; z-index: 60; background: rgba(59,55,46,.4); display: flex; align-items: center; justify-content: center; padding: 3vmin; animation: fadein .25s; }
  .modal .inner { background: var(--paper2); border: 2.5px solid var(--ink); border-radius: 18px 8px 20px 8px / 8px 20px 8px 18px; padding: clamp(14px, 3vmin, 28px); max-width: min(760px, 96%); max-height: 92%; overflow-y: auto; font-size: clamp(13px, 2.4vmin, 17px); box-shadow: 6px 8px 0 rgba(59,55,46,.18); }
  .modal h2 { margin-bottom: 8px; font-size: 1.35em; }
  .modal table { border-collapse: collapse; width: 100%; margin-top: 10px; }
  .modal td, .modal th { border-bottom: 1.5px dashed rgba(59,55,46,.35); padding: 5px 8px; text-align: left; vertical-align: top; }
  .modal .btn { margin-top: 14px; }
  .jlist { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .jrow { display: flex; align-items: center; gap: 10px; border-bottom: 1.5px dashed rgba(59,55,46,.3); padding: 4px 0; }
  .jrow svg { width: 44px; height: 34px; flex: none; }
  .jrow b { display: block; }
  .jrow span { color: var(--ink-soft); font-size: .92em; }

  /* quest checklist */
  .quests { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 2vmin, 18px); width: min(96%, 720px); margin: 1vmin auto; }
  .quest { border: 2.5px solid var(--ink); background: var(--paper2); border-radius: 18px 8px 20px 8px / 8px 20px 8px 18px; padding: 8px 6px; text-align: center; font-size: clamp(13px, 2.8vmin, 20px); font-weight: 700; position: relative; }
  .quest svg { width: clamp(40px, 9vmin, 70px); height: clamp(32px, 7vmin, 56px); display: block; margin: 0 auto 4px; overflow: visible; }
  .quest .qm { position: absolute; top: -12px; right: -6px; background: var(--coral); color: #fff; border: 2px solid var(--ink); border-radius: 50%; width: 30px; height: 30px; line-height: 26px; font-size: 20px; }
  .quest.done .qm { background: var(--sage); }

  /* printable cards */
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .pcard { border: 2px solid var(--ink); border-radius: 14px 6px 16px 6px / 6px 16px 6px 14px; padding: 10px 12px; text-align: center; background: #fff; break-inside: avoid; page-break-inside: avoid; }
  .pcard svg { width: 74px; height: 54px; display: block; margin: 0 auto 4px; }
  .pcard b { display: block; font-size: 1.05em; }
  .pcard span { font-size: .85em; color: var(--ink-soft); display: block; margin-top: 2px; }
  @media print {
    body { background: #fff; overflow: visible; }
    #app, .chrome, .spiral, .modal .btn, .modal h2 small, .toast { display: none !important; }
    .modal { position: static; background: none; padding: 0; display: block; }
    .modal .inner { max-width: none; max-height: none; overflow: visible; border: none; box-shadow: none; }
  }

  /* zoom interlude */
  .zoomwrap { width: min(92%, 680px); text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .zoomwrap svg { width: 100%; overflow: visible; display: block; }
  .zoomlabel { font-size: clamp(30px, 7.5vmin, 60px); font-weight: 700; transform: rotate(-.6deg); }
  .zoomcap { color: var(--ink-soft); font-size: clamp(14px, 2.8vmin, 19px); }

  .boomfx { position: absolute; z-index: 30; left: 12%; top: 40%; width: 140px; height: 140px; transform: translate(-50%, -50%); animation: boomgrow 1.1s ease-out forwards; pointer-events: none; }
  .boomfx svg { width: 100%; height: 100%; overflow: visible; }
  @keyframes boomgrow { 0% { transform: translate(-50%, -50%) scale(.15); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(9); opacity: 0; } }

  .title-scene { align-items: center; justify-content: center; text-align: center; gap: clamp(8px, 2.4vmin, 22px); }
  .title-scene h1 { font-size: clamp(38px, 9.5vmin, 84px); line-height: 1.05; transform: rotate(-1.2deg); text-decoration: underline wavy rgba(232,137,107,.7) 3px; text-underline-offset: 10px; }
  .title-scene p { font-size: clamp(16px, 3.4vmin, 26px); max-width: 680px; line-height: 1.5; color: var(--ink-soft); }
  .title-art { width: min(84%, 620px); } .title-art svg { width: 100%; display: block; overflow: visible; }

  .final { align-items: center; justify-content: center; text-align: center; gap: clamp(20px, 5vmin, 50px); }
  .final .fart { width: clamp(150px, 30vmin, 260px); opacity: 0; animation: slowin 2.5s ease .8s forwards; }
  .final .fart svg { width: 100%; display: block; }
  .final .q { max-width: 860px; font-weight: 700; font-size: clamp(28px, 6.5vmin, 60px); line-height: 1.3; transform: rotate(-.8deg); opacity: 0; animation: slowin 3s ease 3s forwards; }
  @keyframes slowin { to { opacity: 1; } }
  .hint { font-size: clamp(12px, 2.5vmin, 16px); color: var(--ink-soft); text-align: center; z-index: 5; position: relative; flex: none; }
</style>
</head>
<body>
<div class="spiral"></div>
<div id="app"></div>
<div class="chrome" id="chrome">
  <button class="chip" id="questBtn">questions</button>
  <button class="chip" id="journeyBtn">journey so far</button>
  <button class="chip" id="sndBtn">sound: off</button>
  <button class="chip" id="mathBtn">the maths</button>
  <button class="chip" id="cardBtn">cards</button>
</div>

<defs>

    <path class="wash wc-mustard" d="M50 52 q12 -8 20 2 q6 10 -2 16 q-10 6 -18 -2 q-6 -8 0 -16 Z"/>
    <g class="sk rough"><path d="M60 34 L60 12 M60 86 L60 108 M34 60 L10 60 M86 60 L110 60"/><path d="M42 42 L26 26 M78 42 L94 26 M42 78 L26 94 M78 78 L94 94"/><path d="M50 22 L47 30 M70 98 L73 90 M22 50 L30 47 M98 70 L90 73"/><path d="M60 60 q8 -3 6 -10 q-3 -8 -11 -5 q-7 3 -4 10 q3 6 9 5"/><path d="M18 88 l0 6 m-3 -3 l6 0 M96 18 l0 6 m-3 -3 l6 0"/></g>
  </symbol>

        if (cfg.unit === "km") { good = d < 2; msg = good ? "Nailed it!" : "Off by " + (d >= 10 ? Math.round(d) : Math.round(d * 10) / 10) + " km!"; }
        else { good = d < 2; msg = good ? "Nailed it!" : "Off by " + (d >= 2 ? Math.round(d) + " ft!" : Math.round(d * 12) + " inches!"); }
        showOffBy(scene, msg, good, () => {
          factCard(scene, ev.sym, eventCardHtml(ev, y), ev.btn || "Drive on!", () => { starIdx++; nextStep(); });
        });
      });
    }
    const down = (e) => {
      dragging = true;
      const c = e.touches ? e.touches[0] : e;
      const q = clientToSvg(c.clientX, c.clientY);
      setF(nearestF(q.x, q.y)); onUserMove(); e.preventDefault();
    };
    const move = (e) => {
      if (!dragging) return;
      const c = e.touches ? e.touches[0] : e;
      const q = clientToSvg(c.clientX, c.clientY);
      setF(nearestF(q.x, q.y)); onUserMove(); e.preventDefault();
    };
    const up = () => { dragging = false; };
    const keys = (e) => {
      if (e.key === "ArrowRight") { setF(f + .01); onUserMove(); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { setF(f - .01); onUserMove(); e.preventDefault(); }
      else if (e.key === "Enter" && parkBtn) tryPark();
    };
    function onUserMove() {
      const ev = stars[starIdx];
      if (guessing && ev && ev.type === "push" && f > .03) { doPush(ev); return; }
      if (guessing) showPark();
    }
    box.addEventListener("mousedown", down);
    box.addEventListener("touchstart", down, { passive: false });
    window.addEventListener("mousemove", move);
    window.addEventListener("touchmove", move, { passive: false });
    window.addEventListener("mouseup", up);
    window.addEventListener("touchend", up);
    window.addEventListener("keydown", keys);
    function cleanup() {
      window.removeEventListener("mousemove", move); window.removeEventListener("touchmove", move);
      window.removeEventListener("mouseup", up); window.removeEventListener("touchend", up);
      window.removeEventListener("keydown", keys);
    }

    function doPush(ev) {
      guessing = false; dragging = false;
      sfxBoom();
      scene.appendChild(el("div", "boomfx", use("s-boom")));
      setF(0, true);
      lastTruthF = 0;
      addTag(ev);
      const y = yearsOf(ev.at);
      logDiscovery(ev, y);
      setTimeout(() => factCard(scene, ev.sym, eventCardHtml(ev, y), ev.btn || "Drive!", () => { starIdx++; nextStep(); }), 1000);
    }
    function nextStep() {
      const ev = stars[starIdx];
      if (!ev) { finish(); return; }
      say.innerHTML = ev.q;
      say.classList.remove("pop"); void say.offsetWidth;
      guessing = true;
    }
    function finish() {
      finished = true; guessing = false;
      say.innerHTML = cfg.doneText || `Slide back to look again — or carry on.`;
      const btn = el("button", "btn float", cfg.nextLabel || "Carry on");
      btn.addEventListener("click", () => {
        btn.remove(); sfxClick();
        animateTo(1, () => { cleanup(); cfg.next(); });
      });
      scene.appendChild(btn);
    }

    setF(cfg.startF || 0, true);
    setTimeout(() => setF(f), 50);
    nextStep();
  }, { fall: !!cfg.fall });
}

};

/* generic calendar stage: a grid of cells, tap one to guess, then everything is revealed */
function calStage(cfg) {
  showScene((scene) => {
    const say = el("div", "say", cfg.q); scene.appendChild(say);
    const cols = cfg.cols, n = cfg.cells.length, rows = Math.ceil(n / cols);
    const W = 1000, cw = (W - 40) / cols, ch = cfg.ch || 96, H = rows * ch + 40;
    const box = el("div", "mapbox");
    box.style.maxWidth = `min(1000px, calc((100dvh - 200px) * ${(W / H).toFixed(3)}))`;
    box.innerHTML = `<svg class="map" viewBox="0 0 ${W} ${H}"><g id="cells"></g></svg>`;
    const mid = el("div", "midart"); mid.appendChild(box); scene.appendChild(mid);
    scene.appendChild(el("div", "hint", cfg.hint || "Tap a box to guess, then press the button."));
    const svg = box.querySelector("svg"), gCells = svg.querySelector("#cells");
    const cellEls = [];
    cfg.cells.forEach((c, i) => {
      const x = 20 + (i % cols) * cw, y = 20 + Math.floor(i / cols) * ch;
      const g = svgEl("g", { class: "cell" + (cfg.holidays && cfg.holidays[i] ? " hol" : "") });
      g.innerHTML = `<rect x="${x + 3}" y="${y + 3}" width="${cw - 6}" height="${ch - 6}" rx="8"/>
        <text class="lab" x="${x + 12}" y="${y + 22}">${c}</text>` +
        (cfg.holidays && cfg.holidays[i] ? `<text class="hol" x="${x + 12}" y="${y + 36}">${cfg.holidays[i]}</text>` : "");
      g.dataset.i = i; g.dataset.x = x; g.dataset.y = y;
      gCells.appendChild(g); cellEls.push(g);
    });
    let sel = -1, btn = null, done = false;
    cellEls.forEach(g => g.addEventListener("click", () => {
      if (done) return;
      sel = +g.dataset.i; sfxClick();
      cellEls.forEach(c => c.classList.toggle("sel", +c.dataset.i === sel));
      if (!btn) { btn = el("button", "btn float", cfg.confirm || "That one!"); btn.addEventListener("click", reveal); scene.appendChild(btn); }
    }));
    function reveal() {
      if (done) return; done = true; btn.remove();
      const d = Math.abs(sel - cfg.truth);
      cellEls[cfg.truth].classList.add("truth");
      cellEls.forEach(c => c.classList.remove("sel"));
      showOffBy(scene, d === 0 ? "Nailed it!" : `Off by ${d} ${cfg.unit}${d === 1 ? "" : "s"}!`, d === 0, () => {
        // events pop in one by one
        const byCell = {};
        cfg.events.forEach((ev, k) => {
          const g = cellEls[ev.cell]; const x = +g.dataset.x, y = +g.dataset.y;
          const slot = byCell[ev.cell] = (byCell[ev.cell] || 0) + 1;
          const eg = svgEl("g", { class: "evg", opacity: "0" }); eg.style.transition = "opacity .6s";
          const ly = y + ch - 10 - (slot - 1) * 14;
          eg.innerHTML = (slot === 1 ? useAt(ev.sym, x + cw - 24, y + 24, 30) : "") +
            `<text class="ev" x="${x + 12}" y="${ly}">${ev.short || ev.name}</text>`;
          eg.addEventListener("click", (e) => { e.stopPropagation(); sfxClick();
            factCard(scene, ev.sym, `<b>${ev.name}</b><span class="sub">${ev.when}</span>${ev.how ? howLine(ev.how) : ""}`, "Okay"); });
          g.appendChild(eg);
          setTimeout(() => { eg.setAttribute("opacity", "1"); sfxPop(); }, 300 + k * 450);
        });
        const total = 300 + cfg.events.length * 450 + 400;
        setTimeout(() => {
          say.innerHTML = cfg.doneText;
          const nb = el("button", "btn float", cfg.nextLabel);
          nb.addEventListener("click", () => { sfxClick(); nb.remove(); cfg.next(); });
          scene.appendChild(nb);
        }, total);
      });
    }
  }, { fall: !!cfg.fall });
}
